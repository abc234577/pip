name: Build PiPNoShot deb

on:
  push:
    paths:
      - 'tweak/**'
      - '.github/workflows/tweak-deb.yml'
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (newest on runner)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$LATEST/Contents/Developer"

      - name: Install Theos deps (ldid for fake-signing, dpkg for .deb packaging)
        run: brew install ldid dpkg make

      - name: Setup Theos
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build rootless deb (device is rootless / TweakInject)
        run: |
          set -e
          cd tweak/PiPNoShot
          make clean || true
          rm -rf packages && mkdir -p packages
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          echo "--- built packages ---"
          ls -la packages/ || true

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PiPNoShot-deb
          path: tweak/PiPNoShot/packages/*.deb
          if-no-files-found: error
